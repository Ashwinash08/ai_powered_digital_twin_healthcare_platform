{% extends 'base.html' %}

{% block auth_content %}
<div class="auth-container">
    <!-- Interactive Ambient Canvas Background -->
    <canvas id="authCanvas" class="auth-bg-canvas"></canvas>
    <div class="auth-ambient-glow"></div>

    <div class="auth-card admin-auth-card" id="authCard">
        <!-- Brand & Header -->
        <div class="auth-header">
            <div class="auth-header-brand"
                style="background: var(--badge-purple-bg); border-color: var(--badge-purple-border); color: var(--purple-glow); box-shadow: 0 0 16px rgba(168, 85, 247, 0.25);">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                </svg>
                <span>ADMIN SECURITY</span>
            </div>
            <h1>Admin Portal</h1>
        </div>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="auth-alert"
            style="border-color: var(--badge-purple-border); background: var(--badge-purple-bg); color: var(--purple-glow);"
            role="alert">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span>
                {% for message in messages %}
                {{ message }}{% if not loop.last %}<br>{% endif %}
                {% endfor %}
            </span>
        </div>
        {% endif %}
        {% endwith %}

        <form method="post" id="adminLoginForm">
            <!-- Email Input -->
            <div class="auth-input-group">
                <label for="email">Administrator Email</label>
                <div class="auth-input-wrapper">
                    <span class="auth-input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z">
                            </path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                    </span>
                    <input type="email" id="email" name="email" class="auth-input" required
                        placeholder="admin@healthtwin.com" autocomplete="email">
                </div>
            </div>

            <!-- Password Input -->
            <div class="auth-input-group">
                <label for="password">Security Password</label>
                <div class="auth-input-wrapper">
                    <span class="auth-input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </span>
                    <input type="password" id="password" name="password" class="auth-input" required
                        placeholder="••••••••" style="padding-right: 3rem;" autocomplete="current-password">
                    <button type="button" class="password-toggle-btn" onclick="togglePassword('password', this)"
                        aria-label="Toggle password visibility">
                        <svg class="eye-icon" viewBox="0 0 24 24" width="18" height="18" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="auth-btn"
                style="background: linear-gradient(135deg, #9333ea 0%, #7c3aed 100%); box-shadow: 0 6px 22px rgba(147, 51, 234, 0.45); border-color: rgba(192, 132, 252, 0.35); margin-top: 1.25rem;">
                <span>Authenticate</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </form>

        <script>
            function togglePassword(inputId, btn) {
                const input = document.getElementById(inputId);
                const icon = btn.querySelector('.eye-icon');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
                } else {
                    input.type = 'password';
                    icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
                }
            }

            // Interactive particle canvas
            (function initAuthCanvas() {
                const canvas = document.getElementById('authCanvas');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let width, height;
                let particles = [];
                const mouse = { x: null, y: null, radius: 120 };

                function resize() {
                    width = canvas.width = window.innerWidth;
                    height = canvas.height = window.innerHeight;
                    particles = [];
                    const count = Math.floor((width * height) / 22000);
                    for (let i = 0; i < count; i++) {
                        particles.push({
                            x: Math.random() * width,
                            y: Math.random() * height,
                            vx: (Math.random() - 0.5) * 0.4,
                            vy: (Math.random() - 0.5) * 0.4,
                            radius: Math.random() * 2 + 1,
                            alpha: Math.random() * 0.4 + 0.15
                        });
                    }
                }

                window.addEventListener('resize', resize);
                window.addEventListener('mousemove', (e) => {
                    mouse.x = e.clientX;
                    mouse.y = e.clientY;
                });
                window.addEventListener('mouseleave', () => {
                    mouse.x = null;
                    mouse.y = null;
                });

                function animate() {
                    ctx.clearRect(0, 0, width, height);
                    const isDark = (document.documentElement.getAttribute('data-theme') || 'dark') === 'dark';

                    for (let i = 0; i < particles.length; i++) {
                        const p = particles[i];
                        p.x += p.vx;
                        p.y += p.vy;
                        if (p.x < 0 || p.x > width) p.vx *= -1;
                        if (p.y < 0 || p.y > height) p.vy *= -1;

                        if (mouse.x !== null) {
                            const dx = mouse.x - p.x;
                            const dy = mouse.y - p.y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist < mouse.radius) {
                                p.x -= (dx / dist) * 1.5;
                                p.y -= (dy / dist) * 1.5;
                            }
                        }

                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                        ctx.fillStyle = isDark ? `rgba(168, 85, 247, ${p.alpha})` : `rgba(147, 51, 234, ${p.alpha})`;
                        ctx.fill();

                        for (let j = i + 1; j < particles.length; j++) {
                            const p2 = particles[j];
                            const dx = p.x - p2.x;
                            const dy = p.y - p2.y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist < 110) {
                                ctx.beginPath();
                                ctx.moveTo(p.x, p.y);
                                ctx.lineTo(p2.x, p2.y);
                                ctx.strokeStyle = isDark ? `rgba(168, 85, 247, ${(1 - dist / 110) * 0.15})` : `rgba(147, 51, 234, ${(1 - dist / 110) * 0.12})`;
                                ctx.lineWidth = 1;
                                ctx.stroke();
                            }
                        }
                    }
                    requestAnimationFrame(animate);
                }

                resize();
                animate();
            })();
        </script>

        <!-- Footer Navigation -->
        <div class="auth-footer">
            <div style="display: flex; justify-content: center; gap: 0.75rem;">
                <a href="{{ url_for('index') }}" class="auth-nav-pill">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    <span>Back to Home</span>
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
